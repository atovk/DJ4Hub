name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-go:
    timeout-minutes: 30
    name: Go (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install native dependencies
        run: brew install pkg-config libusb
      - name: Check scripts
        run: |
          for script in packaging/dj4ghub packaging/install scripts/*.sh; do sh -n "$script"; done
          python3 -c 'import ast, pathlib; ast.parse(pathlib.Path("scripts/collect-go-licenses.py").read_text())'
      - name: Vet
        run: go vet ./...
      - name: Test installer upgrades
        run: python3 scripts/test-macos-install.py
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Build
        run: ./scripts/build-macos.sh "${{ matrix.arch }}"

  test-native-app:
    timeout-minutes: 30
    name: Native macOS app tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Swift tests
        run: swift test --package-path apps/hub-macos
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Web phone audio tests
        run: node --test scripts/phone-audio.test.cjs
